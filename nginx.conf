server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compresión de texto (las imágenes WebP/PNG ya vienen comprimidas)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml font/ttf font/otf;

    # Cabeceras de seguridad básicas (se repiten en cada location porque add_header no se hereda si la location define las suyas)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # No servir archivos ocultos (va primero: nginx usa la primera expresión regular que coincide)
    location ~ /\. {
        deny all;
    }

    # La página siempre se revalida, para que los cambios se vean apenas se publican
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Fuentes: nginx no trae los tipos de .otf y .ttf en su lista por defecto
    location ~* \.otf$ {
        types { }
        default_type font/otf;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.ttf$ {
        types { }
        default_type font/ttf;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Imágenes y scripts: caché de 7 días
    location ~* \.(?:webp|png|jpg|jpeg|svg|woff2?|js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
